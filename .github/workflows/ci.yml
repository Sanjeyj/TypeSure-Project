name: TypeSure CI / CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    name: Test, Benchmark & Security Audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax and Bytecode Compilation Check
        run: |
          python -m py_compile app.py typesure/*.py scripts/*.py

      - name: Execute Full Automated Pytest Suite
        run: |
          pytest tests/ -v

      - name: Run Academic Tamil NLP Evaluation Benchmark
        run: |
          python scripts/evaluate.py

      - name: Verify Evaluation Artifacts Generated
        run: |
          test -f data/evaluation_results.csv
          test -f reports/baseline_vs_improved.csv
